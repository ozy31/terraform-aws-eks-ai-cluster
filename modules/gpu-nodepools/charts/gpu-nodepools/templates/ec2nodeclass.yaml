apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: {{ .Values.nodeClass.name }}
spec:
  role: {{ required "nodeRole is required" .Values.nodeRole | quote }}
  # On GPU instance types the alias resolves to the accelerated image
  # (EKS-optimized AL2023 NVIDIA, or Bottlerocket aws-k8s-*-nvidia).
  amiSelectorTerms:
    - alias: {{ printf "%s@%s" .Values.nodeClass.os .Values.nodeClass.amiAliasVersion | quote }}
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: {{ required "clusterName is required" .Values.clusterName | quote }}
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: {{ .Values.clusterName | quote }}
  metadataOptions:
    httpEndpoint: enabled
    httpProtocolIPv6: disabled
    httpTokens: required
    # Pods use EKS Pod Identity, so they never need to reach IMDS.
    httpPutResponseHopLimit: 1
  {{- if .Values.nodeClass.instanceStoreRaid }}
  # Local NVMe striped into RAID0 and used for containerd + emptyDir.
  # Multi-GB images and model shards load from NVMe instead of gp3.
  instanceStorePolicy: RAID0
  {{- end }}
  blockDeviceMappings:
    {{- if eq .Values.nodeClass.os "bottlerocket" }}
    - deviceName: /dev/xvda
      ebs:
        volumeSize: 4Gi
        volumeType: gp3
        encrypted: true
        deleteOnTermination: true
    - deviceName: /dev/xvdb
      ebs:
        volumeSize: {{ printf "%vGi" .Values.nodeClass.rootVolumeSizeGiB }}
        volumeType: gp3
        iops: 6000
        throughput: 500
        encrypted: true
        deleteOnTermination: true
    {{- else }}
    - deviceName: /dev/xvda
      ebs:
        volumeSize: {{ printf "%vGi" .Values.nodeClass.rootVolumeSizeGiB }}
        volumeType: gp3
        iops: 6000
        throughput: 500
        encrypted: true
        deleteOnTermination: true
    {{- end }}
  {{- with .Values.tags }}
  tags:
    {{- toYaml . | nindent 4 }}
  {{- end }}
